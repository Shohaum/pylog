[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "xylog"
version = "3.0.0"

description = "A lightweight, modern, and extensible logging library for Python."

readme = "README.md"

requires-python = ">=3.11"

authors = [
    { name = "Shohaum Sarkar" }
]

license = { text = "MIT" }

keywords = [
    "logging",
    "logger",
    "python",
    "log",
    "library",
    "structured logging",
    "async logging",
]


classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",

    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = []


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]


[project.urls]
Homepage = "https://github.com/Shohaum/xylog"
Repository = "https://github.com/Shohaum/xylog"
Issues = "https://github.com/Shohaum/xylog/issues"


[tool.setuptools]
include-package-data = true


[tool.setuptools.packages.find]
include = [
    "xylog*",
]


[tool.pytest.ini_options]
testpaths = [
    "tests",
]

addopts = "-q"